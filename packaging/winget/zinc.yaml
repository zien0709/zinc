# Winget manifest for zinc
# Submit via: wingetcreate submit --token <GITHUB_PAT> --prtitle "New package: zinc 0.1.0" packaging/winget/
# Or manually: https://github.com/microsoft/winget-pkgs/fork -> PR
# Docs: https://learn.microsoft.com/en-us/windows/package-manager/package/manifest

PackageIdentifier: zien0709.zinc
PackageVersion: 0.1.0
PackageLocale: en-US
Publisher: zinc contributors
PublisherUrl: https://github.com/zien0709/zinc
PackageName: zinc
PackageUrl: https://github.com/zien0709/zinc
License: MIT
LicenseUrl: https://github.com/zien0709/zinc/blob/main/LICENSE
ShortDescription: A free, self-hosted long-URL generator on Cloudflare Quick Tunnels
Description: |-
  zinc turns any link into a secret URL on a Cloudflare Quick Tunnel and gives
  you a terminal dashboard to see who opened it, change where it goes, and destroy it.
  No account, no server, no domain required. Runs on your own computer.
Moniker: zinc
Tags:
  - url-shortener
  - cloudflare
  - tunnel
  - terminal
  - cli
ManifestType: singleton
ManifestVersion: 1.6.0

# Installer section — update InstallerUrl and InstallerSha256 per release
Installers:
  - Architecture: x64
    InstallerType: portable
    InstallerUrl: https://github.com/zien0709/zinc/releases/download/v0.1.0/zinc-windows-x64.exe
    InstallerSha256: REPLACE_WITH_SHA256
    Commands:
      - zinc

# Locale overrides
PackageLocale: zh-TW
Publisher: zinc contributors
PackageName: zinc
ShortDescription: 免費、自架的長網址產生器（基於 Cloudflare Quick Tunnel）
Description: |-
  zinc 把任何連結變成 Cloudflare Quick Tunnel 上的祕密網址，並提供終端機儀表板
  讓你查看誰打開了它、更改目的地、或銷毀它。不需帳號、伺服器或網域，跑在你自己的電腦上。