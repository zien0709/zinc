[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zinc-link"
dynamic = ["version"]
description = "A free, self-hosted long-URL generator on Cloudflare Quick Tunnels, with a terminal dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["url", "tunnel", "cloudflare", "trycloudflare", "tui", "qr"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "aiohttp>=3.14.4",     # older releases have known HTTP-handling CVEs (this server faces the internet)
    "textual>=4.0.0",
    "rich>=13.9.4",
    "segno>=1.6.1",
]

[project.optional-dependencies]
geo = ["maxminddb>=2.0"]                    # offline country lookup (DB-IP / GeoLite2 .mmdb) when Cloudflare's header is missing
dev = ["pytest>=8", "pillow>=10", "zxing-cpp>=3.1.1,<3.2", "coverage>=7", "pyyaml>=6"]

[project.scripts]
zinc = "zinc.__main__:main"

[tool.setuptools]
packages = ["zinc"]

[tool.setuptools.dynamic]
version = { attr = "zinc.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
