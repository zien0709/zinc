# Keeps the commit-pinned GitHub Actions in .github/workflows/ci.yml fresh: Dependabot opens a pull request that
# moves the pin to the new release's commit (and updates the "# vN" comment next to it).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
